server:
  port: ${MATCHING_SERVICE_PORT:8083}

spring:
  application:
    name: matching-service

# Other services this one calls. Kept in configuration rather than hard-coded
# in Java, so they can be repointed without a rebuild.
services:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
