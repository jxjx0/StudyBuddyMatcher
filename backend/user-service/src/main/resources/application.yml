server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./backend/.env[.properties],optional:file:../backend/.env[.properties]"
  application:
    name: user-service
  datasource:
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/studybuddy}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  sql:
    init:
      mode: always

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
  seed:
    demo-data: ${DEMO_DATA_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@studybuds.sg}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    student-password: ${SEED_STUDENT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
