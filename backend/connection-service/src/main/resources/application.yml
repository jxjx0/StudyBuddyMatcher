server:
  port: ${CONNECTION_SERVICE_PORT:8084}

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./backend/.env[.properties],optional:file:../backend/.env[.properties]"
  application:
    name: connection-service

# Other services this one calls. Kept in configuration rather than hard-coded
# in Java, so they can be repointed without a rebuild.
services:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  contact-service-secret: ${CONTACT_SERVICE_SECRET:}

app:
  auth:
    jwt-secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
